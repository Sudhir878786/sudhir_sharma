<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenwiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#screenwiseGrad)"/>
  
  <!-- Circuit pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="30"/>
    <circle cx="300" cy="150" r="40"/>
    <circle cx="150" cy="300" r="35"/>
    <circle cx="320" cy="350" r="25"/>
    <line x1="130" y1="100" x2="260" y2="150"/>
    <line x1="185" y1="300" x2="295" y2="350"/>
  </g>
  
  <!-- AI Brain/Network icon -->
  <g transform="translate(200, 250)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" filter="url(#aiGlow)"/>
    <circle cx="-40" cy="-30" r="12" fill="#00d4ff" filter="url(#aiGlow)"/>
    <circle cx="40" cy="-30" r="12" fill="#00d4ff" filter="url(#aiGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#00d4ff" filter="url(#aiGlow)"/>
    <circle cx="-30" cy="40" r="12" fill="#00d4ff" filter="url(#aiGlow)"/>
    <circle cx="30" cy="40" r="12" fill="#00d4ff" filter="url(#aiGlow)"/>
    
    <!-- Connecting lines -->
    <line x1="-40" y1="-30" x2="0" y2="0" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="-30" x2="0" y2="0" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-30" y2="40" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="30" y2="40" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Invisible eye icon -->
  <g transform="translate(200, 420)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,5"/>
    <line x1="-50" y1="-5" x2="50" y2="5" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#aiGlow)">
    SCREENWISE.AI
  </text>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" text-anchor="middle">
    AI Interview Assistant
  </text>
</svg>
