<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="syncanoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#191414;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#syncanoGrad)"/>
  
  <!-- Dark overlay -->
  <rect width="400" height="600" fill="#000000" opacity="0.5"/>
  
  <!-- Vinyl record design -->
  <circle cx="200" cy="250" r="120" fill="#1a1a1a" opacity="0.8"/>
  <circle cx="200" cy="250" r="100" fill="#000000" opacity="0.9"/>
  <circle cx="200" cy="250" r="30" fill="#1DB954" filter="url(#glow)"/>
  
  <!-- Sound waves -->
  <path d="M 50 200 Q 100 180 150 200 T 250 200 T 350 200" stroke="#1DB954" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 50 250 Q 100 230 150 250 T 250 250 T 350 250" stroke="#1DB954" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 50 300 Q 100 280 150 300 T 250 300 T 350 300" stroke="#1DB954" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Multiple user icons (collaboration) -->
  <g opacity="0.7">
    <circle cx="120" cy="450" r="20" fill="#1DB954"/>
    <circle cx="200" cy="430" r="20" fill="#1DB954"/>
    <circle cx="280" cy="450" r="20" fill="#1DB954"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    SYNCANO
  </text>
  <text x="200" y="550" font-family="Arial, sans-serif" font-size="18" fill="#1DB954" text-anchor="middle">
    Listen Together, Anywhere
  </text>
</svg>
