<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcdcaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#569cd6;stop-opacity:1" />
    </linearGradient>
    <filter id="glowBlog">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Document base -->
  <path d="M16 8 L16 56 L48 56 L48 20 L36 8 Z" 
        fill="url(#blogGrad)" opacity="0.9" filter="url(#glowBlog)"/>
  
  <!-- Folded corner -->
  <path d="M36 8 L36 20 L48 20 Z" fill="#1e1e1e" opacity="0.6"/>
  
  <!-- Text lines -->
  <line x1="22" y1="28" x2="42" y2="28" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="40" x2="38" y2="40" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Pen icon overlay -->
  <path d="M38 42 L42 46 L44 44 L40 40 Z" fill="#4ec9b0" opacity="0.9"/>
  <path d="M42 46 L40 48 L36 44 L38 42 Z" fill="#569cd6" opacity="0.9"/>
