<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="corpGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#maqGrad)"/>
  
  <!-- Corporate grid pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
  </g>
  
  <!-- Mobile phone outline -->
  <rect x="140" y="150" width="120" height="220" rx="15" fill="#0f172a" opacity="0.8" stroke="#0ea5e9" stroke-width="3" filter="url(#corpGlow)"/>
  
  <!-- Screen content - Dashboard elements -->
  <rect x="150" y="165" width="100" height="15" rx="3" fill="#0ea5e9" opacity="0.8"/>
  <rect x="150" y="190" width="70" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="150" y="205" width="85" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="150" y="220" width="60" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Chart visualization -->
  <g opacity="0.7">
    <rect x="155" y="260" width="12" height="40" fill="#10b981"/>
    <rect x="175" y="240" width="12" height="60" fill="#10b981"/>
    <rect x="195" y="250" width="12" height="50" fill="#10b981"/>
    <rect x="215" y="230" width="12" height="70" fill="#10b981"/>
    <rect x="235" y="245" width="12" height="55" fill="#10b981"/>
  </g>
  
  <!-- User icons representing employees -->
  <g opacity="0.6">
    <circle cx="90" cy="480" r="15" fill="#0ea5e9"/>
    <circle cx="200" cy="460" r="18" fill="#0ea5e9" filter="url(#corpGlow)"/>
    <circle cx="310" cy="480" r="15" fill="#0ea5e9"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#corpGlow)">
    MAQ SOFTWARE
  </text>
  <text x="200" y="545" font-family="Arial, sans-serif" font-size="16" fill="#0ea5e9" text-anchor="middle">
    Enterprise Mobile Solution
  </text>
</svg>
