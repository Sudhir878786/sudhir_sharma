<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <filter id="codeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#cfGrad)"/>
  
  <!-- Dark code editor background -->
  <rect x="50" y="120" width="300" height="280" rx="10" fill="#1a1a1a" opacity="0.9" stroke="#ffa500" stroke-width="2"/>
  
  <!-- Code lines -->
  <g font-family="Consolas, monospace" font-size="14">
    <text x="70" y="160" fill="#00ff00" opacity="0.8">def solve():</text>
    <text x="90" y="185" fill="#ffffff" opacity="0.7">n = int(input())</text>
    <text x="90" y="210" fill="#ffffff" opacity="0.7">arr = list(map(int,</text>
    <text x="110" y="235" fill="#ffffff" opacity="0.7">input().split()))</text>
    <text x="90" y="260" fill="#87ceeb" opacity="0.8">result = sum(arr)</text>
    <text x="90" y="285" fill="#ffff00" opacity="0.8">print(result)</text>
    <text x="70" y="315" fill="#00ff00" opacity="0.8">solve()</text>
  </g>
  
  <!-- Difficulty tags -->
  <g transform="translate(200, 440)">
    <rect x="-80" y="-15" width="50" height="25" rx="5" fill="#00ff00" opacity="0.8"/>
    <text x="-55" y="2" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold">EASY</text>
    
    <rect x="-20" y="-15" width="65" height="25" rx="5" fill="#ffa500" opacity="0.8"/>
    <text x="12.5" y="2" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold">MEDIUM</text>
    
    <rect x="55" y="-15" width="50" height="25" rx="5" fill="#ff0000" opacity="0.8"/>
    <text x="80" y="2" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">HARD</text>
  </g>
  
  <!-- Calendar icon (daily problem) -->
  <g transform="translate(200, 80)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#1a1a1a" opacity="0.8" stroke="#ffa500" stroke-width="2"/>
    <rect x="-25" y="-25" width="50" height="12" rx="5" fill="#ffa500"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="20" fill="#ffa500" text-anchor="middle" font-weight="bold">22</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#codeGlow)">
    CANON FORCES
  </text>
  <text x="200" y="540" font-family="Arial, sans-serif" font-size="16" fill="#ffa500" text-anchor="middle">
    Daily Coding Challenge
  </text>
</svg>
